name: Sincronizar proventos CVM (FIIs)

on:
  schedule:
    # toda segunda-feira às 09:00 UTC (~06:00 horário de Brasília)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      diagnostico:
        description: 'Modo diagnóstico (não grava nada no Firestore, só inspeciona os dados da CVM)'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install --prefix scripts

      - name: Executar sincronização
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DIAGNOSTIC: ${{ inputs.diagnostico }}
        run: node scripts/sync-cvm.js
