  const [erro, setErro] = useState(null);

  const submit = async e => {

// ── Dashboard ───────────────────────────────────────────────────────────────
const BRAPI_TOKEN = 't3g2H8756gEiXjLa7R3Dpc';

function calcPosicoes(ops) {
  const sorted = [...ops].sort((a,b)=>a.data<b.data?-1:1);
  const pos = {};
  sorted.forEach(op => {
    if (!pos[op.codigo]) pos[op.codigo] = {codigo:op.codigo, tipoAtivo:op.tipoAtivo, qtd:0, avg:0};
    const p = pos[op.codigo];
    if (op.tipo==='compra') {
      const nq = p.qtd + op.qtd;
      p.avg = nq>0 ? (p.qtd*p.avg + op.qtd*op.preco)/nq : 0;
      p.qtd = nq;
    } else { p.qtd = Math.max(0, p.qtd-op.qtd); }
  });
  return Object.values(pos).filter(p=>p.qtd>0);
}

// quantidade que o usuário possuía de um ativo até uma determinada data (inclusive)
function qtyAtDate(ops, codigo, dateISO) {
  let qtd = 0;
  ops.filter(o=>o.codigo===codigo && o.data<=dateISO)
     .sort((a,b)=>a.data<b.data?-1:1)
     .forEach(op => { qtd += op.tipo==='compra' ? op.qtd : -op.qtd; });
  return Math.max(0, qtd);
}

// remove sufixo de mercado fracionário (ex: RAIZ4F -> RAIZ4) para consultar a API
function tickerForQuote(codigo) {
  return /^[A-Z]{4}\d{1,2}F$/.test(codigo) ? codigo.slice(0,-1) : codigo;
}

const fmtDataBR = iso => { if(!iso) return '-'; const [y,m,d]=String(iso).split('-'); return `${d}/${m}/${y}`; };

function Dashboard({ user }) {
  const [ops, setOps] = useState([]);
  const [proventos, setProventos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [cotacoes, setCotacoes] = useState({});
  const [loadingMercado, setLoadingMercado] = useState(false);
  const [erroMercado, setErroMercado] = useState(null);

  useEffect(() => {
    return db.collection('usuarios').doc(user.uid).collection('operacoes')
      .orderBy('data','asc')
      .onSnapshot(snap => { setOps(snap.docs.map(d=>({id:d.id,...d.data()}))); setLoading(false); }, ()=>setLoading(false));
  }, [user.uid]);

  useEffect(() => {
    return db.collection('usuarios').doc(user.uid).collection('proventos')
      .onSnapshot(snap => setProventos(snap.docs.map(d=>d.data())), ()=>{});
  }, [user.uid]);

  const posicoes = calcPosicoes(ops);
  const investido = posicoes.reduce((s,p)=>s+p.qtd*p.avg, 0);
  const tickersKey = posicoes.map(p=>p.codigo).sort().join(',');

  useEffect(() => {
    if (posicoes.length===0) return;
    const tickers = [...new Set(posicoes.map(p=>tickerForQuote(p.codigo)))];
    setLoadingMercado(true); setErroMercado(null);
    Promise.all(tickers.map(tk =>
      fetch(`https://brapi.dev/api/quote/${tk}?token=${BRAPI_TOKEN}`)
        .then(r=>r.json())
        .then(data => (data.results && data.results[0]) || null)
        .catch(()=>null)
    )).then(resultados => {
      const cot = {};
      let algumErro = false;
      resultados.forEach((r,i) => {
        if (!r) { algumErro = true; return; }
        cot[r.symbol] = r.regularMarketPrice;
      });
      setCotacoes(cot);
      if (algumErro) setErroMercado('Alguns ativos não puderam ser consultados agora (limite ou ticker não encontrado).');
    }).finally(()=>setLoadingMercado(false));
  }, [tickersKey]);

  const valorAtual = posicoes.reduce((s,p)=>{
    const preco = cotacoes[tickerForQuote(p.codigo)];
    return s + p.qtd * (preco!=null ? preco : p.avg);
  }, 0);
  const variacao = valorAtual - investido;
  const variacaoPct = investido>0 ? (variacao/investido)*100 : 0;
  const temCotacao = Object.keys(cotacoes).length>0;

  // ── Proventos lançados manualmente: total nos últimos 30 dias e no mês atual
  const hoje = new Date().toISOString().slice(0,10);
  const ha30 = new Date(Date.now()-30*86400000).toISOString().slice(0,10);
  const mesAtual = hoje.slice(0,7);
  const recebidos30d = proventos.filter(p=>p.data>=ha30 && p.data<=hoje).sort((a,b)=> a.data<b.data?1:-1);
  const recebidosMes = proventos.filter(p=>p.data.slice(0,7)===mesAtual);
  const totalRecebido30d = recebidos30d.reduce((s,r)=>s+r.total,0);
  const totalRecebidoMes = recebidosMes.reduce((s,r)=>s+r.total,0);

  const s = { padding:'16px 16px 100px', maxWidth:'600px', margin:'0 auto' };

  return (
    <div style={{ background:C.bg, minHeight:'100vh' }}>
      <div style={s}>
        <div style={{ color:C.gold, fontSize:'11px', textTransform:'uppercase', letterSpacing:'0.12em', marginBottom:'4px' }}>Carteira · Resumo</div>
        <div className="display num" style={{ fontSize:'36px', fontWeight:600, marginBottom:'4px' }}>{fmt(valorAtual)}</div>
        <div style={{ display:'flex', flexWrap:'wrap', alignItems:'center', gap:'8px', fontSize:'13px', marginBottom:'16px' }}>
          <span style={{ color:C.muted }}>Investido: <span className="num">{fmt(investido)}</span></span>
          {temCotacao && (
            <span className="num" style={{ fontWeight:600, color: variacao>=0?C.green:C.red, display:'flex', alignItems:'center', gap:'4px' }}>
              {variacao>=0?<IcoUp/>:<IcoDown/>} {fmt(Math.abs(variacao))} ({Math.abs(variacaoPct).toFixed(2)}%)
            </span>
          )}
        </div>

        {loadingMercado && <div style={{ fontSize:'12px', color:C.muted, marginBottom:'12px' }}>Buscando cotações e dividendos...</div>}
        {erroMercado && (
          <div style={{ background:'rgba(248,113,113,0.08)', border:`1px solid ${C.red}`, color:C.red, borderRadius:'10px', padding:'10px 12px', marginBottom:'16px', fontSize:'12px', display:'flex', gap:'8px', alignItems:'flex-start' }}>
            <IcoAlert/>{erroMercado}
          </div>
        )}

        {posicoes.length>0 && (
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'8px', marginBottom:'24px' }}>
            <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:'10px', padding:'12px' }}>
              <div style={{ color:C.muted, fontSize:'10px', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:'6px' }}>Recebido (30d)</div>
              <div className="num" style={{ fontSize:'18px', fontWeight:600, color:C.green, marginBottom:'8px' }}>{fmt(totalRecebido30d)}</div>
              {recebidos30d.slice(0,4).map((r,i)=>(
                <div key={i} style={{ display:'flex', justifyContent:'space-between', fontSize:'11px', color:C.muted, marginBottom:'2px' }}>
                  <span className="num">{r.codigo} · {fmtDataBR(r.data)}</span>
                  <span className="num">{fmt(r.total)}</span>
                </div>
              ))}
              {recebidos30d.length===0 && <div style={{ fontSize:'11px', color:C.muted }}>Nenhum lançado nos últimos 30 dias</div>}
            </div>
            <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:'10px', padding:'12px' }}>
              <div style={{ color:C.muted, fontSize:'10px', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:'6px' }}>Total no mês</div>
              <div className="num" style={{ fontSize:'18px', fontWeight:600, color:C.gold, marginBottom:'8px' }}>{fmt(totalRecebidoMes)}</div>
              <div style={{ fontSize:'11px', color:C.muted, lineHeight:'1.5' }}>
                {recebidosMes.length>0 ? `${recebidosMes.length} provento(s) lançado(s) este mês` : 'Lance seus proventos em "Lançar → Provento"'}
              </div>
            </div>
          </div>
        )}

        <div style={{ display:'flex', alignItems:'center', gap:'8px', color:C.muted, marginBottom:'12px' }}>
          <IcoWallet/><span style={{ fontSize:'11px', textTransform:'uppercase', letterSpacing:'0.1em' }}>Posições</span>
        </div>

        <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:'12px', overflow:'hidden' }}>
          {loading && <div style={{ padding:'32px', textAlign:'center', color:C.muted, fontSize:'14px' }}>Carregando...</div>}
          {!loading && posicoes.length===0 && (
            <div style={{ padding:'40px 24px', textAlign:'center', color:C.muted, fontSize:'14px', lineHeight:'1.6' }}>
              Nenhuma posição ainda.<br/>Lance operações ou importe um extrato.
            </div>
          )}
          {posicoes.map((p,i) => {
            const preco = cotacoes[tickerForQuote(p.codigo)];
            const temPreco = preco!=null;
            const resultado = temPreco ? (preco-p.avg)*p.qtd : null;
            const resultadoPct = temPreco && p.avg>0 ? ((preco-p.avg)/p.avg)*100 : null;
            const positivo = resultado!=null && resultado>=0;
            return (
              <div key={p.codigo} style={{ padding:'12px 16px', borderBottom:i<posicoes.length-1?`1px solid ${C.border}`:'none' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'8px', gap:'8px' }}>
                  <div>
                    <span className="num" style={{ fontWeight:600, fontSize:'14px' }}>{p.codigo}</span>
                    <span style={{ color:C.muted, fontSize:'12px', marginLeft:'8px' }}>{p.tipoAtivo}</span>
                  </div>
                  {resultadoPct!=null && (
                    <div style={{ textAlign:'right', flexShrink:0 }}>
                      <div className="num" style={{ fontSize:'13px', fontWeight:600, color:positivo?C.green:C.red, display:'flex', alignItems:'center', gap:'4px', justifyContent:'flex-end' }}>
                        {positivo?<IcoUp/>:<IcoDown/>}{Math.abs(resultadoPct).toFixed(2)}%
                      </div>
                      <div className="num" style={{ fontSize:'11px', color:C.muted }}>{positivo?'+':'-'}{fmt(Math.abs(resultado))}</div>
                    </div>
                  )}
                </div>
                <div style={{ display:'flex', justifyContent:'space-between', borderTop:`1px solid ${C.border}`, paddingTop:'8px' }}>
                  <div><div style={{ color:C.muted, fontSize:'11px', textTransform:'uppercase', marginBottom:'2px' }}>Qtd</div><div className="num" style={{ fontSize:'13px' }}>{p.qtd}</div></div>
                  <div style={{ textAlign:'center' }}><div style={{ color:C.muted, fontSize:'11px', textTransform:'uppercase', marginBottom:'2px' }}>Médio</div><div className="num" style={{ fontSize:'13px' }}>{fmt(p.avg)}</div></div>
                  <div style={{ textAlign:'right' }}><div style={{ color:C.muted, fontSize:'11px', textTransform:'uppercase', marginBottom:'2px' }}>Atual</div><div className="num" style={{ fontSize:'13px' }}>{temPreco?fmt(preco):'—'}</div></div>
                  <div style={{ textAlign:'right' }}><div style={{ color:C.muted, fontSize:'11px', textTransform:'uppercase', marginBottom:'2px' }}>Total</div><div className="num" style={{ fontSize:'13px' }}>{fmt(p.qtd*(temPreco?preco:p.avg))}</div></div>
                </div>
              </div>
            );
          })}
        </div>

        <div style={{ fontSize:'11px', color:C.muted, marginTop:'12px', lineHeight:'1.5' }}>
          Cotações e dividendos via brapi.dev. "A receber" considera proventos com data-com já confirmada ou estimativa pela posição atual — confira sempre antes de declarar.
        </div>
      </div>
    </div>
  );
}

function TabOperacao({ user }) {
  const [tipo, setTipo] = useState('compra');
  const [ticker, setTicker] = useState('');
  const [tipoAtivo, setTipoAtivo] = useState('Ação');
  const [data, setData] = useState(new Date().toISOString().slice(0,10));
  const [qtd, setQtd] = useState('');
  const [preco, setPreco] = useState('');
  const [taxas, setTaxas] = useState('');
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);

  const qtdN = parseFloat(qtd)||0;
  const precoN = parseFloat(String(preco).replace(',','.'))||0;
  const taxasN = parseFloat(String(taxas).replace(',','.'))||0;
  const bruto = qtdN * precoN;
  const total = tipo==='compra' ? bruto+taxasN : bruto-taxasN;
  const valid = ticker.trim().length>=4 && qtdN>0 && precoN>0 && data;

  const inp = { background:C.surface2, border:`1px solid ${C.border}`, color:C.text, borderRadius:'8px', padding:'10px 12px', width:'100%', fontSize:'14px', fontFamily:"'IBM Plex Mono',monospace" };
  const lbl = { color:C.muted, fontSize:'11px', textTransform:'uppercase', letterSpacing:'0.08em', display:'block', marginBottom:'6px' };

  const submit = async () => {
    if (!valid) return;
    setSaving(true);
    try {
      await db.collection('usuarios').doc(user.uid).collection('operacoes').add({
        tipo, codigo:ticker.trim().toUpperCase(), tipoAtivo, data,
        qtd:qtdN, preco:precoN, taxas:taxasN, total,
        criadoEm: firebase.firestore.FieldValue.serverTimestamp()
      });
      setSaved(true); setTicker(''); setQtd(''); setPreco(''); setTaxas('');
      setTimeout(()=>setSaved(false), 2000);

  const [ops, setOps] = useState([]);

  useEffect(() => {
    return db.collection('usuarios').doc(user.uid).collection('operacoes')
      .onSnapshot(snap => setOps(snap.docs.map(d=>d.data())), ()=>{});
  }, [user.uid]);

  useEffect(() => {
    return db.collection('usuarios').doc(user.uid).collection('proventos')
      .orderBy('data','desc').limit(8)
      .onSnapshot(snap => setRecentes(snap.docs.map(d=>({id:d.id,...d.data()}))), ()=>{});

  // ao digitar um ticker que já está na carteira, sugere a quantidade atual

    const posicoes = calcPosicoes(ops);

const parseNum = v => typeof v==='number'?v:parseFloat(String(v||0).replace(',','.'));
const toISO = s => { const [d,m,y]=s.split('/'); return `${y}-${m}-${d}`; };
const parseDataStr = s => { const [d,m,y]=s.split('/'); return new Date(`${y}-${m}-${d}`); };
const mapTipo = c => /11$/.test(c)?'FII':'Ação';
const nMs=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const nomeMes=k=>{const[y,m]=k.split('-');return `${nMs[parseInt(m)-1]}/${y}`;};

// ── Leitura de notas de corretagem em PDF ───────────────────────────────────
async function parseNotaPDF(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for (let i=1; i<=pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const items = content.items
      .map(it => ({ str: it.str, x: it.transform[4], y: it.transform[5] }))
      .filter(it => it.str.trim().length>0);
    // reconstrói a ordem de leitura (linhas de cima p/ baixo, dentro da linha esquerda p/ direita)
    const lines = [];
    items.forEach(it => {
      let line = lines.find(l => Math.abs(l.y - it.y) < 3);
      if (!line) { line = { y: it.y, items: [] }; lines.push(line); }
      line.items.push(it);
    });
    lines.sort((a,b)=>b.y-a.y);
    lines.forEach(line => {
      line.items.sort((a,b)=>a.x-b.x);
      text += line.items.map(it=>it.str).join(' ') + ' ';
    });
  }
  const dateMatch = text.match(/(\d{2}\/\d{2}\/\d{4})/);
  const codeMatch = text.match(/\b(WIN|WDO|IND|DOL|WSP|BIT)\s?[A-Z]\d{2}\b/);
  const valueMatches = [...text.matchAll(/(\d{1,3}(?:\.\d{3})*,\d{2})\s*([DC])\b/g)];
  let resultado = 0;
  if (valueMatches.length) {
    const last = valueMatches[valueMatches.length-1];
    const val = parseFloat(last[1].replace(/\./g,'').replace(',','.'));
    resultado = last[2]==='D' ? -val : val;
  }
  return {
    data: dateMatch ? dateMatch[1] : '',
    codigo: codeMatch ? codeMatch[0].replace(/\s+/g,' ') : '',
    resultado,
  };
}

function TabNotasPDF({ user }) {
  const [itens, setItens] = useState([]);

  const handleFiles = async files => {
    setErro(null); setLendo(true); setSaved(false);
    try {

        try {
          const parsed = await parseNotaPDF(f);
          novos.push({ nome:f.name, ...parsed });
        } catch {
          novos.push({ nome:f.name, data:'', codigo:'', resultado:0 });
        }
      }
      setItens(prev=>[...prev, ...novos]);
    } catch {
      setErro('Não foi possível ler um ou mais arquivos. Confira se são PDFs válidos.');
    } finally { setLendo(false); }
  };

  const updateItem = (i, field, val) => setItens(prev => prev.map((it,idx)=> idx===i?{...it,[field]:val}:it));
  const removeItem = i => setItens(prev=>prev.filter((_,idx)=>idx!==i));

  const salvar = async () => {
    setSaving(true);
    try {
      const batch = db.batch();
      itens.forEach(it=>{
        if (!it.data) return;
        const iso = toISO(it.data);
        const ref = db.collection('usuarios').doc(user.uid).collection('daytrade_pregoes').doc(iso);
        batch.set(ref, { data: it.data, codigo: it.codigo, resultado: parseFloat(String(it.resultado).replace(',','.'))||0, fonte:'pdf', criadoEm: firebase.firestore.FieldValue.serverTimestamp() });
      });
      await batch.commit();
      setSaved(true); setItens([]);
    } finally { setSaving(false); }
  };

  const inpStyle = { background:C.surface2, border:`1px solid ${C.border}`, color:C.text, borderRadius:'6px', padding:'6px 8px', fontSize:'12px', fontFamily:"'IBM Plex Mono',monospace", width:'100%' };

  return (
    <div>
      <label style={{ display:'block', background:C.surface, border:`2px dashed ${C.border}`, borderRadius:'12px', padding:'32px 24px', textAlign:'center', cursor:'pointer', marginBottom:'16px' }}>
        <input type="file" accept="application/pdf" multiple style={{ display:'none' }} onChange={e=>e.target.files?.length && handleFiles(Array.from(e.target.files))} />
        <div style={{ fontSize:'36px', marginBottom:'12px' }}>📄</div>
        <div style={{ fontSize:'14px', fontWeight:500, marginBottom:'4px' }}>Toque para selecionar 1 ou mais PDFs</div>
        <div style={{ fontSize:'12px', color:C.muted }}>Notas de corretagem com operações de day trade (Mini Índice)</div>
      </label>

      {lendo && <div style={{ textAlign:'center', color:C.muted, fontSize:'13px', marginBottom:'12px' }}>Lendo arquivos...</div>}
      {erro && <div style={{ marginBottom:'16px', background:'rgba(248,113,113,0.08)', border:`1px solid ${C.red}`, color:C.red, borderRadius:'8px', padding:'10px 12px', fontSize:'13px', display:'flex', gap:'8px', alignItems:'flex-start' }}><IcoAlert/>{erro}</div>}

      {itens.length>0 && (
        <React.Fragment>
          <div style={{ color:C.muted, fontSize:'12px', marginBottom:'8px' }}>Confira os dados extraídos antes de salvar:</div>
          <div style={{ display:'flex', flexDirection:'column', gap:'8px', marginBottom:'16px' }}>
            {itens.map((it,i)=>(
              <div key={i} style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:'10px', padding:'12px' }}>
                <div style={{ fontSize:'11px', color:C.muted, marginBottom:'8px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{it.nome}</div>
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr auto', gap:'6px', alignItems:'end' }}>
                  <div>
                    <div style={{ fontSize:'10px', color:C.muted, textTransform:'uppercase', marginBottom:'2px' }}>Data</div>
                    <input value={it.data} onChange={e=>updateItem(i,'data',e.target.value)} placeholder="DD/MM/AAAA" style={inpStyle} />
                  </div>
                  <div>
                    <div style={{ fontSize:'10px', color:C.muted, textTransform:'uppercase', marginBottom:'2px' }}>Ativo</div>
                    <input value={it.codigo} onChange={e=>updateItem(i,'codigo',e.target.value)} style={inpStyle} />
                  </div>
                  <div>
                    <div style={{ fontSize:'10px', color:C.muted, textTransform:'uppercase', marginBottom:'2px' }}>Resultado líq.</div>
                    <input value={it.resultado} onChange={e=>updateItem(i,'resultado',e.target.value)} style={{...inpStyle, color: parseFloat(String(it.resultado).replace(',','.'))>=0?C.green:C.red}} />
                  </div>
                  <button onClick={()=>removeItem(i)} style={{ background:'none', border:'none', color:C.red, fontSize:'18px', cursor:'pointer', padding:'6px' }}>×</button>
                </div>
              </div>
            ))}
          </div>
          <button onClick={salvar} disabled={saving} style={{ width:'100%', borderRadius:'10px', padding:'12px', background:C.gold, color:'#1A1206', border:'none', fontSize:'14px', fontWeight:600, cursor:'pointer', marginBottom:'8px' }}>
            {saving?'Salvando...':`Salvar ${itens.length} pregão(ões)`}
          </button>
        </React.Fragment>
      )}
      {saved && <div style={{ display:'flex', alignItems:'center', gap:'8px', color:C.green, fontSize:'13px', justifyContent:'center', padding:'12px' }}><IcoCheck/> Pregões salvos com sucesso</div>}

      <div style={{ fontSize:'11px', color:C.muted, marginTop:'8px', lineHeight:'1.5' }}>
        O app procura na nota o "Total líquido da nota" e a data do pregão. Confira sempre os valores antes de salvar — o layout pode variar entre corretoras.
      </div>
    </div>
  );
}

// ── Sub-aba: Resumo Day Trade (mensal + DARF) ───────────────────────────────
function TabResumoDT({ user }) {
  const [pregoes, setPregoes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [expandMes, setExpandMes] = useState(null);

  useEffect(() => {
    return db.collection('usuarios').doc(user.uid).collection('daytrade_pregoes')
      .onSnapshot(snap=>{ setPregoes(snap.docs.map(d=>d.data())); setLoading(false); }, ()=>setLoading(false));
  }, [user.uid]);

  const meses = {};
  pregoes.forEach(p=>{
    if (!p.data) return;
    const dt = parseDataStr(p.data);
    const mk = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;
    if(!meses[mk]) meses[mk]={dias:[],resultado:0};
    meses[mk].dias.push(p); meses[mk].resultado += (p.resultado||0);
  });
  const mesesOrdenados = Object.entries(meses).sort((a,b)=>a[0]<b[0]?1:-1);

  if (loading) return <div style={{ textAlign:'center', color:C.muted, fontSize:'14px', padding:'32px' }}>Carregando...</div>;
  if (mesesOrdenados.length===0) return (
    <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:'12px', padding:'32px 20px', textAlign:'center', color:C.muted, fontSize:'13px', lineHeight:'1.6' }}>
      Nenhum pregão de day trade salvo ainda.<br/>Importe as notas na aba "Notas PDF".
    </div>
  );

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:'12px' }}>
      {mesesOrdenados.map(([mk,info])=>{
        const lucro = info.resultado>0;
        const darf = lucro ? info.resultado*0.2 : 0;
        const gera = darf>=10;
        const open = expandMes===mk;
        const dias = [...info.dias].sort((a,b)=>parseDataStr(a.data)-parseDataStr(b.data));
        return (
          <div key={mk} style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:'12px', overflow:'hidden' }}>
            <button onClick={()=>setExpandMes(open?null:mk)} style={{ width:'100%', padding:'12px 16px', display:'flex', justifyContent:'space-between', alignItems:'center', background:'none', border:'none', cursor:'pointer', color:C.text }}>
              <div style={{ textAlign:'left' }}>
                <div style={{ fontSize:'14px', fontWeight:500 }}>{nomeMes(mk)}</div>
                <div style={{ fontSize:'12px', color:C.muted }}>{dias.length} pregão(ões) · valores oficiais</div>
              </div>
              <div style={{ display:'flex', alignItems:'center', gap:'8px' }}>
                <span className="num" style={{ fontWeight:600, color:lucro?C.green:C.red }}>{lucro?'+':''}{fmt(info.resultado)}</span>
                {open?<IcoUp/>:<IcoDown/>}
              </div>
            </button>
            {open && (
              <div style={{ borderTop:`1px solid ${C.border}` }}>
                {dias.map((d,i)=>(
                  <div key={i} style={{ padding:'8px 16px', display:'flex', justifyContent:'space-between', fontSize:'12px', borderBottom:`1px solid ${C.border}`, color:C.muted }}>
                    <span className="num">{d.data} · {d.codigo}</span>
                    <span className="num" style={{ color:(d.resultado||0)>=0?C.green:C.red }}>{fmt(d.resultado||0)}</span>
                  </div>
                ))}
                <div style={{ background:C.surface2, padding:'12px 16px' }}>
                  <div style={{ display:'flex', justifyContent:'space-between', fontSize:'12px', marginBottom:'6px', color:C.muted }}>
                    <span>Alíquota (20% sobre lucro)</span><span className="num">{fmt(darf)}</span>
                  </div>
                  <div style={{ display:'flex', justifyContent:'space-between', fontSize:'13px', fontWeight:600 }}>
                    <span style={{ color:C.gold }}>{gera?'DARF estimado (cód. 6015)':'Sem DARF'}</span>
                    <span className="num" style={{ color:C.gold }}>{gera?fmt(darf):'—'}</span>
                  </div>
                  {!gera && <div style={{ fontSize:'11px', color:C.muted, marginTop:'4px' }}>{lucro?'Valor abaixo de R$10':'Prejuízo compensável em meses futuros'}</div>}
                  <div style={{ fontSize:'11px', color:C.muted, marginTop:'6px' }}>* Já inclui taxas/corretagem (extraído da nota).</div>
                </div>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── Sub-aba: Cadastro de FIIs (CNPJ para integração CVM) ────────────────────
const maskCNPJ = v => {
  const d = String(v||'').replace(/\D/g,'').slice(0,14);
  let r = d;
  if (d.length>2) r = d.slice(0,2)+'.'+d.slice(2);
  if (d.length>5) r = r.slice(0,6)+'.'+r.slice(6);
  if (d.length>8) r = r.slice(0,10)+'/'+r.slice(10);
  if (d.length>12) r = r.slice(0,15)+'-'+r.slice(15);
  return r;
};

function TabCadastroFII({ user }) {
  const [ops, setOps] = useState([]);
  const [cadastros, setCadastros] = useState({});
  const [loading, setLoading] = useState(true);
  const [edits, setEdits] = useState({});
  const [savingTicker, setSavingTicker] = useState(null);
  const [novoTicker, setNovoTicker] = useState('');
  const [novoCNPJ, setNovoCNPJ] = useState('');
  const [novoNome, setNovoNome] = useState('');
  const [savingNovo, setSavingNovo] = useState(false);

  useEffect(() => {
    return db.collection('usuarios').doc(user.uid).collection('operacoes')
      .onSnapshot(snap => setOps(snap.docs.map(d=>d.data())), ()=>{});
  }, [user.uid]);

  useEffect(() => {
    return db.collection('usuarios').doc(user.uid).collection('fii_cadastro')
      .onSnapshot(snap => {
        const m = {};
        snap.docs.forEach(d=>{ m[d.id]=d.data(); });
        setCadastros(m); setLoading(false);
      }, ()=>setLoading(false));
  }, [user.uid]);

  const posicoesFII = calcPosicoes(ops).filter(p=>p.tipoAtivo==='FII');
  const extras = Object.keys(cadastros).filter(t=>!posicoesFII.some(p=>p.codigo===t));

  const inp = { background:C.surface2, border:`1px solid ${C.border}`, color:C.text, borderRadius:'8px', padding:'10px 12px', width:'100%', fontSize:'14px', fontFamily:"'IBM Plex Mono',monospace" };
  const lbl = { color:C.muted, fontSize:'11px', textTransform:'uppercase', letterSpacing:'0.08em', display:'block', marginBottom:'6px' };

  const salvar = async (ticker, cnpjRaw, nome) => {
    const digits = String(cnpjRaw||'').replace(/\D/g,'');
    if (digits.length!==14) return;
    setSavingTicker(ticker);
    try {
      await db.collection('usuarios').doc(user.uid).collection('fii_cadastro').doc(ticker).set({
        ticker, cnpj: digits, nome: nome||'', atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
      }, {merge:true});
    } finally { setSavingTicker(null); }
  };

  const remover = async ticker => {
    await db.collection('usuarios').doc(user.uid).collection('fii_cadastro').doc(ticker).delete();
  };

  const adicionarExtra = async () => {
    const ticker = novoTicker.trim().toUpperCase();
    const digits = novoCNPJ.replace(/\D/g,'');
    if (!ticker || digits.length!==14) return;
    setSavingNovo(true);
    try {
      await db.collection('usuarios').doc(user.uid).collection('fii_cadastro').doc(ticker).set({
        ticker, cnpj: digits, nome: novoNome.trim(), atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
      }, {merge:true});
      setNovoTicker(''); setNovoCNPJ(''); setNovoNome('');
    } finally { setSavingNovo(false); }
  };

  if (loading) return <div style={{ textAlign:'center', color:C.muted, fontSize:'14px', padding:'32px' }}>Carregando...</div>;

  return (
    <div>
      <div style={{ background:'rgba(217,168,92,0.08)', border:`1px solid ${C.gold}`, borderRadius:'10px', padding:'10px 12px', marginBottom:'16px', fontSize:'12px', color:C.muted, display:'flex', gap:'8px', alignItems:'flex-start' }}>
        <span style={{ color:C.gold, marginTop:'1px' }}><IcoInfo/></span>
        Cadastre o CNPJ de cada FII (do fundo, não seu CPF). Isso permite que o app cruze os rendimentos divulgados pela CVM com a sua carteira e lance os proventos automaticamente.
      </div>

      {posicoesFII.length===0 && extras.length===0 && (
        <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:'12px', padding:'32px 20px', textAlign:'center', color:C.muted, fontSize:'13px', lineHeight:'1.6', marginBottom:'20px' }}>
          Você ainda não tem FIIs na carteira.
        </div>
      )}

      {posicoesFII.length>0 && (
        <div style={{ display:'flex', flexDirection:'column', gap:'10px', marginBottom:'20px' }}>
          {posicoesFII.map(p=>{
            const atual = cadastros[p.codigo];
            const valor = edits[p.codigo]!==undefined ? edits[p.codigo] : (atual ? maskCNPJ(atual.cnpj) : '');
            return (
              <div key={p.codigo} style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:'10px', padding:'12px' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'8px' }}>
                  <span className="num" style={{ fontWeight:600, fontSize:'14px' }}>{p.codigo}</span>
                  {atual && <span style={{ display:'flex', alignItems:'center', gap:'4px', color:C.green, fontSize:'11px' }}><IcoCheck/> cadastrado</span>}
                </div>
                <div style={{ display:'flex', gap:'8px' }}>
                  <input value={valor} onChange={e=>setEdits(s=>({...s,[p.codigo]:maskCNPJ(e.target.value)}))} placeholder="00.000.000/0000-00" maxLength={18} style={inp} />
                  <button onClick={()=>salvar(p.codigo, edits[p.codigo]!==undefined?edits[p.codigo]:(atual?atual.cnpj:''))}
                    disabled={savingTicker===p.codigo}
                    style={{ borderRadius:'8px', padding:'10px 16px', background:C.gold, color:'#1A1206', border:'none', fontSize:'13px', fontWeight:600, cursor:'pointer', whiteSpace:'nowrap' }}>
                    {savingTicker===p.codigo?'...':'Salvar'}
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {extras.length>0 && (
        <React.Fragment>
          <div style={{ color:C.muted, fontSize:'11px', textTransform:'uppercase', letterSpacing:'0.1em', marginBottom:'8px' }}>Outros FIIs cadastrados</div>
          <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:'12px', overflow:'hidden', marginBottom:'20px' }}>
            {extras.map((t,i)=>(
              <div key={t} style={{ padding:'10px 16px', display:'flex', justifyContent:'space-between', alignItems:'center', borderBottom:i<extras.length-1?`1px solid ${C.border}`:'none' }}>
                <div>
                  <span className="num" style={{ fontWeight:600, fontSize:'13px' }}>{t}</span>
                  <span style={{ color:C.muted, fontSize:'12px', marginLeft:'8px' }}>{maskCNPJ(cadastros[t].cnpj)}</span>
                </div>
                <button onClick={()=>remover(t)} style={{ background:'none', border:'none', color:C.red, fontSize:'12px', cursor:'pointer' }}>remover</button>
              </div>
            ))}
          </div>
        </React.Fragment>
      )}

      <div style={{ color:C.muted, fontSize:'11px', textTransform:'uppercase', letterSpacing:'0.1em', marginBottom:'8px' }}>Adicionar outro FII</div>
      <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:'12px', padding:'16px', display:'flex', flexDirection:'column', gap:'12px' }}>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 2fr', gap:'8px' }}>
          <div><label style={lbl}>Ticker</label><input value={novoTicker} onChange={e=>setNovoTicker(e.target.value.toUpperCase())} placeholder="XPML11" maxLength={6} style={inp} /></div>
          <div><label style={lbl}>CNPJ do fundo</label><input value={novoCNPJ} onChange={e=>setNovoCNPJ(maskCNPJ(e.target.value))} placeholder="00.000.000/0000-00" maxLength={18} style={inp} /></div>
        </div>
        <div><label style={lbl}>Nome (opcional)</label><input value={novoNome} onChange={e=>setNovoNome(e.target.value)} placeholder="Nome do fundo" style={inp} /></div>
        <button onClick={adicionarExtra} disabled={savingNovo} style={{ borderRadius:'10px', padding:'12px', background:C.gold, color:'#1A1206', border:'none', fontSize:'14px', fontWeight:600, cursor:'pointer' }}>
          {savingNovo?'Salvando...':'Adicionar'}
        </button>
      </div>

      <div style={{ fontSize:'11px', color:C.muted, marginTop:'12px', lineHeight:'1.5' }}>
        O CNPJ do fundo (diferente do seu CPF) pode ser encontrado na página do FII na B3, no Fundamentus ou no informe mensal do fundo.
      </div>
    </div>
  );
}

// ── Página Importação (com abas) ────────────────────────────────────────────
function ImportarExtrato({ user }) {
  const [tab, setTab] = useState('xlsx');
  const titulos = { xlsx:'Extrato B3', pdf:'Notas de corretagem', resumo:'Resumo Day Trade', cvm:'Cadastro de FIIs (CVM)' };
  return (
    <div style={{ background:C.bg, minHeight:'100vh', padding:'16px 16px 100px' }}>
      <div style={{ maxWidth:'480px', margin:'0 auto' }}>
        <div style={{ color:C.gold, fontSize:'11px', textTransform:'uppercase', letterSpacing:'0.12em', marginBottom:'4px' }}>Importação</div>
        <div className="display" style={{ fontSize:'26px', fontWeight:600, marginBottom:'16px' }}>{titulos[tab]}</div>
        <div style={{ display:'flex', gap:'6px', marginBottom:'20px', flexWrap:'wrap' }}>
          <TabBtn active={tab==='xlsx'} onClick={()=>setTab('xlsx')}>Extrato B3</TabBtn>
          <TabBtn active={tab==='pdf'} onClick={()=>setTab('pdf')}>Notas PDF</TabBtn>
          <TabBtn active={tab==='resumo'} onClick={()=>setTab('resumo')}>Day Trade</TabBtn>
          <TabBtn active={tab==='cvm'} onClick={()=>setTab('cvm')}>FIIs (CVM)</TabBtn>
        </div>
        {tab==='xlsx' && <TabExtratoXLSX user={user} />}
        {tab==='pdf' && <TabNotasPDF user={user} />}
        {tab==='resumo' && <TabResumoDT user={user} />}
        {tab==='cvm' && <TabCadastroFII user={user} />}
      </div>
    </div>
  );
}


// ── App Root ────────────────────────────────────────────────────────────────
function App() {
  const [user, setUser] = useState(undefined);
  const [page, setPage] = useState('dashboard');
  useEffect(() => auth.onAuthStateChanged(u=>setUser(u)), []);
  if (user===undefined) return <div style={{ background:C.bg, minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', color:C.muted, fontSize:'14px' }}>Carregando...</div>;
  if (!user) return <Login />;
  return (
    <div>
      {page==='dashboard' && <Dashboard user={user} />}
      {page==='lancar' && <LancarOperacao user={user} />}
      {page==='importar' && <ImportarExtrato user={user} />}
      <BottomNav page={page} setPage={setPage} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
